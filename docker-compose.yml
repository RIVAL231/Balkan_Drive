services:
  # PostgreSQL Database
  database:
    image: postgres:14
    container_name: balkan-drive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: graphqlmvp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - balkan-drive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d graphqlmvp"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balkan-drive-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=graphqlmvp
      - DB_SSLMODE=disable
      
      # Server Configuration
      - JWT_SECRET=srainvkaalp2630185amrahs
      - PORT=8080
      - GIN_MODE=release
      
      # AWS S3 Configuration (set these in .env or environment)
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-AKIA2FXADQTYAAZEZQV3}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-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}
      - S3_BUCKET=${S3_BUCKET:-go-drive-v2}
      
      # Rate Limiting & Storage
      - RATE_LIMIT=2.0
      - RATE_LIMIT_BURST=5
      - DEFAULT_STORAGE_QUOTA=10485760
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - balkan-drive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balkan-drive-frontend
    restart: unless-stopped
    ports:
      - "3001:80"  # Changed from 3000 to 3001 to avoid port conflict
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - balkan-drive-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  balkan-drive-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
