name: Docker Compose Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  docker-compose-test:
    name: Test Docker Compose Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create test environment
      run: |
        cat > .env << EOF
        DB_HOST=database
        DB_PORT=5432
        DB_USER=admin
        DB_PASSWORD=admin
        DB_NAME=graphqlmvp
        JWT_SECRET=test-jwt-secret
        AWS_REGION=eu-north-1
        AWS_ACCESS_KEY_ID=test-key
        AWS_SECRET_ACCESS_KEY=test-secret
        S3_BUCKET=test-bucket
        EOF

    - name: Start services
      run: |
        echo "🚀 Starting Balkan Drive..."
        docker compose up -d --build
        
        echo "📊 Waiting for services..."
        sleep 30
        
        echo "🔍 Service status:"
        docker compose ps

    - name: Run health checks
      run: |
        echo "🏥 Running health checks..."
        
        # Wait for database to be ready
        echo "🗄️ Testing database..."
        timeout 60 bash -c 'until docker compose exec -T database pg_isready -h localhost -U admin; do sleep 2; done'
        
        # Test database connection
        docker compose exec -T database psql -U admin -d graphqlmvp -c "SELECT 1;"
        
        # Test backend health endpoint
        echo "🔧 Testing backend..."
        timeout 120 bash -c 'until curl -f http://localhost:8080/health; do sleep 5; done'
        
        # Test GraphQL endpoint
        curl -X POST http://localhost:8080/query \
          -H "Content-Type: application/json" \
          -d '{"query": "{ __schema { types { name } } }"}'
        
        # Test frontend
        echo "🌐 Testing frontend..."
        timeout 60 bash -c 'until curl -f http://localhost:3001; do sleep 3; done'
        
        echo "✅ All health checks passed!"

    - name: Show logs on failure
      if: failure()
      run: |
        echo "📋 Service logs:"
        docker compose logs --tail=50

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
        docker system prune -f